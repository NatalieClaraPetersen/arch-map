    <body>
        <div class="card" style="width: 100%">
            
            
            <div id="mynetwork" class="card-body"></div>
        </div>

        
        
            <div id="config"></div>
        

        <script type="text/javascript">

              // initialize global variables.
              var edges;
              var nodes;
              var allNodes;
              var allEdges;
              var nodeColors;
              var originalNodes;
              var network;
              var container;
              var options, data;
              var filter = {
                  item : '',
                  property : '',
                  value : []
              };

              

              

              // This method is responsible for drawing the graph, returns the drawn network
              function drawGraph() {
                  var container = document.getElementById('mynetwork');

                  

                  // parsing and collecting nodes and edges from the python
                  nodes = new vis.DataSet([{"color": "#97c2fc", "count": 843, "id": "CORE", "label": "CORE", "shape": "dot", "size": 100.0, "title": "CORE\nIndegree: 2\nOutdegree: 3\nModules grouped together: 843"}, {"color": "#b1b1b1", "count": 7, "id": "LOGGING", "label": "LOGGING", "shape": "dot", "size": 25.534441805225654, "title": "LOGGING\nIndegree: 3\nOutdegree: 0\nModules grouped together: 7"}, {"color": "#b1b1b1", "count": 5, "id": "CONFIG", "label": "CONFIG", "shape": "dot", "size": 25.356294536817103, "title": "CONFIG\nIndegree: 2\nOutdegree: 0\nModules grouped together: 5"}, {"color": "#97c2fc", "count": 119, "id": "API", "label": "API", "shape": "dot", "size": 35.510688836104514, "title": "API\nIndegree: 3\nOutdegree: 3\nModules grouped together: 119"}, {"color": "#97c2fc", "count": 12, "id": "OPERATIONS", "label": "OPERATIONS", "shape": "dot", "size": 25.97980997624703, "title": "OPERATIONS\nIndegree: 0\nOutdegree: 3\nModules grouped together: 12"}, {"color": "#97c2fc", "count": 1, "id": "CL", "label": "CL", "shape": "dot", "size": 25.0, "title": "CL\nIndegree: 0\nOutdegree: 1"}]);
                  edges = new vis.DataSet([{"arrows": "to", "count": 88, "from": "CORE", "label": "88", "to": "LOGGING", "width": 1}, {"arrows": "to", "count": 10, "from": "CORE", "label": "10", "to": "CONFIG", "width": 1}, {"arrows": "to", "count": 2, "from": "CORE", "label": "2", "to": "API", "width": 1}, {"arrows": "to", "count": 21, "from": "OPERATIONS", "label": "21", "to": "CORE", "width": 1}, {"arrows": "to", "count": 8, "from": "OPERATIONS", "label": "8", "to": "LOGGING", "width": 1}, {"arrows": "to", "count": 8, "from": "OPERATIONS", "label": "8", "to": "API", "width": 1}, {"arrows": "to", "count": 712, "from": "API", "label": "712", "to": "CORE", "width": 1}, {"arrows": "to", "count": 6, "from": "API", "label": "6", "to": "CONFIG", "width": 1}, {"arrows": "to", "count": 43, "from": "API", "label": "43", "to": "LOGGING", "width": 1}, {"arrows": "to", "count": 2, "from": "CL", "label": "2", "to": "API", "width": 1}]);

                  nodeColors = {};
                  allNodes = nodes.get({ returnType: "Object" });
                  for (nodeId in allNodes) {
                    nodeColors[nodeId] = allNodes[nodeId].color;
                  }
                  allEdges = edges.get({ returnType: "Object" });
                  // adding nodes and edges to the graph
                  data = {nodes: nodes, edges: edges};

                  var options = {
    "configure": {
        "enabled": true,
        "filter": true
    },
    "edges": {
        "color": {
            "inherit": true
        },
        "smooth": {
            "enabled": true,
            "type": "dynamic"
        }
    },
    "interaction": {
        "dragNodes": true,
        "hideEdgesOnDrag": false,
        "hideNodesOnDrag": false
    },
    "physics": {
        "enabled": true,
        "forceAtlas2Based": {
            "avoidOverlap": 0.01,
            "centralGravity": 0.01,
            "damping": 0.4,
            "gravitationalConstant": -50,
            "springConstant": 0.08,
            "springLength": 100
        },
        "solver": "forceAtlas2Based",
        "stabilization": {
            "enabled": true,
            "fit": true,
            "iterations": 1000,
            "onlyDynamicEdges": false,
            "updateInterval": 50
        }
    }
};

                  


                  
                  // if this network requires displaying the configure window,
                  // put it in its div
                  options.configure["container"] = document.getElementById("config");
                  

                  network = new vis.Network(container, data, options);

                  

                  

                  


                  

                  return network;

              }
              drawGraph();
        </script>
