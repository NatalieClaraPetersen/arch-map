REPO_URL: "https://github.com/zeeguu/api.git"
CODE_ROOT_FOLDER: "content/api/"
save_location: "./diagrams"
views:
  - name: Backend Core
    include:
      - "zeeguu.api.*"
    exclude:
      - "zeeguu.api.test.*"
    groups:
      UTILS:
        - "zeeguu.api.utils"
        - "zeeguu.api.utils.*"
      ENDPOINTS:
        - "zeeguu.api.endpoints"
        - "zeeguu.api.endpoints.*"
    options:
      collapse_groups: true
      external_dependencies: false
