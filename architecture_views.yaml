REPO_URL: "https://github.com/zeeguu/api.git"
CODE_ROOT_FOLDER: "content/api/"
save_location: "./diagrams"
views:
  - name: "zeeguu_api.html"
    include:
      - "zeeguu.api.*"
    exclude:
      - "zeeguu.api.test.*"
    groups:
      UTILS:
        - "zeeguu.api.utils"
        - "zeeguu.api.utils.*"
      ENDPOINTS:
        - "zeeguu.api.endpoints"
        - "zeeguu.api.endpoints.*"

  - name: "zeeguu_overview.html"
    include:
      - "zeeguu.*"
    groups:
      CL:
        - "zeeguu.cl"
        - "zeeguu.cl.*"
      API:
        - "zeeguu.api"
        - "zeeguu.api.*"
      CORE:
        - "zeeguu.core"
        - "zeeguu.core.*"
      CONFIG:
        - "zeeguu.config"
        - "zeeguu.config.*"
      LOGGING:
        - "zeeguu.logging"
        - "zeeguu.logging.*"
      OPERATIONS:
        - "zeeguu.operations"
        - "zeeguu.operations.*"
